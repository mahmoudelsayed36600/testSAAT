<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة اختبارات التحصيلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&family=Tajawal:wght@400;500;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: same system as منصة التحصيلي الذكية — sticky header with pill tabs, centered content, navy accent, green = answered/success, amber = review */
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --soft:#EEF1F5; --ink:#17233B; --mut:#5E6A80; --line:#DDE2EA;
  --acc:#17233B; --onacc:#FFFFFF; --hero:#17233B; --hero-ink:#E8ECF4; --hero-line:rgba(255,255,255,.12);
  --ok:#0E7C6B; --okbg:#DDF3EE; --flag:#C97A00; --flagbg:#FFF0D1; --bad:#B93A32; --badbg:#FBE5E3; --info:#2F5FB3; --infobg:#E3ECFA;
  --shadow:0 1px 2px rgba(23,35,59,.05),0 4px 18px rgba(23,35,59,.06);
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --fd:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1624; --card:#18223A; --soft:#1F2B47; --ink:#E8ECF4; --mut:#9AA6BC; --line:#2B3856;
  --acc:#E8ECF4; --onacc:#0F1624; --hero:#1C2945; --hero-ink:#E8ECF4; --hero-line:rgba(255,255,255,.1);
  --ok:#4FD1B8; --okbg:#12403A; --flag:#F0AD3A; --flagbg:#43310E; --bad:#F08A82; --badbg:#47201D; --info:#8DB3F5; --infobg:#1E3156;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1624; --card:#18223A; --soft:#1F2B47; --ink:#E8ECF4; --mut:#9AA6BC; --line:#2B3856;
  --acc:#E8ECF4; --onacc:#0F1624; --hero:#1C2945; --hero-ink:#E8ECF4; --hero-line:rgba(255,255,255,.1);
  --ok:#4FD1B8; --okbg:#12403A; --flag:#F0AD3A; --flagbg:#43310E; --bad:#F08A82; --badbg:#47201D; --info:#8DB3F5; --infobg:#1E3156;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
#app{min-height:100%;display:flex;flex-direction:column}
body{background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--font);direction:rtl}
h1,h2,h3,h4{margin:0;line-height:1.4;text-wrap:balance;font-weight:700}
h1{font-size:1.55rem}h2{font-size:1.2rem}h3{font-size:1.02rem}h4{font-size:.93rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.num,td.n{font-variant-numeric:tabular-nums}
mjx-container{direction:ltr;display:inline-block}
mjx-container[display="true"]{display:block;margin:.4em 0!important}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line);background:var(--card);padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--mut)}
.btn.p{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme="dark"] .btn.ok{color:#08201B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ok{color:#08201B}}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.f.on{background:var(--flagbg);border-color:var(--flag);color:var(--flag)}
.btn.sm{padding:.28rem .65rem;font-size:.82rem}
.btn.lg{padding:.75rem 1.4rem;font-size:1rem}
.btn:disabled,.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.55rem .7rem;min-width:0}
.in:focus{border-color:var(--acc);outline:none}
textarea.in{resize:vertical;min-height:80px;line-height:1.75}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field>label,.lbl{font-size:.82rem;color:var(--mut);font-weight:600}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:860px){.g2,.g3,.g4,.g21{grid-template-columns:minmax(0,1fr)}}
.chk{display:inline-flex;gap:.45rem;align-items:center;cursor:pointer;font-size:.9rem}
.chk input{width:auto;accent-color:var(--ok)}
.mut{color:var(--mut)}.small{font-size:.84rem}.tiny{font-size:.76rem}
.pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.76rem;font-weight:700;border-radius:99px;padding:.1rem .65rem;background:var(--bg);border:1px solid var(--line);white-space:nowrap;color:var(--mut)}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.pill.fl{background:var(--flagbg);color:var(--flag);border-color:var(--flag)}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.pill.info{background:var(--infobg);color:var(--info);border-color:var(--info)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.3}}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;border:1.5px solid var(--line);vertical-align:-1px;flex:none}

/* header (LMS style) */
header.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.hdr .top{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,3vw,24px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-box{width:38px;height:38px;border-radius:9px;background:var(--hero);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-box img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo-box svg{width:24px;height:24px}
.hdr nav{display:flex;gap:4px;overflow-x:auto;padding:0 clamp(8px,3vw,20px) 8px;scrollbar-width:thin}
.hdr nav button{border:0;background:none;padding:7px 14px;border-radius:8px;white-space:nowrap;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;font-weight:500}
.hdr nav button:hover{background:var(--soft)}
.hdr nav button[aria-selected=true]{background:var(--acc);color:var(--onacc);font-weight:700}
.hdr nav .cnt{font-size:.72rem;background:var(--soft);color:var(--mut);border-radius:99px;padding:0 .45rem}
.hdr nav button[aria-selected=true] .cnt{background:rgba(255,255,255,.18);color:inherit}
.who{font-size:.84rem;color:var(--mut);white-space:nowrap}
@media (max-width:640px){.who{display:none}}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.icon-btn svg{width:19px;height:19px}
.icon-btn .b{position:absolute;top:-5px;left:-5px;background:var(--flag);color:#fff;font-size:.68rem;font-weight:700;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
main.wrap{max-width:1200px;width:100%;margin:0 auto;padding:18px clamp(12px,3vw,24px) 40px;display:flex;flex-direction:column;gap:16px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{flex:1;min-width:0}
.empty{text-align:center;padding:2rem 1rem;color:var(--mut);display:flex;flex-direction:column;gap:.7rem;align-items:center}
.empty b{color:var(--ink);font-size:1.05rem}
.sub{display:flex;gap:6px;overflow-x:auto;flex-wrap:wrap}
.sub button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;white-space:nowrap;cursor:pointer;font-size:.86rem;display:inline-flex;gap:.35rem;align-items:center}
.sub button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .in{width:auto;flex:1 1 170px;min-width:140px}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:.78rem;white-space:nowrap;background:var(--soft)}
tbody tr:hover td{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:center}
.sc{display:inline-block;min-width:3.3em;padding:.08rem .45rem;border-radius:6px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.sc.hi{background:var(--okbg);color:var(--ok)}.sc.md{background:var(--flagbg);color:var(--flag)}.sc.lo{background:var(--badbg);color:var(--bad)}
.delta{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}.delta.eq{color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:.86rem}
.hb .bar{height:10px}
.stack{display:flex;height:10px;border-radius:4px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}

/* login */
.login{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-side{background:var(--hero);color:var(--hero-ink);padding:clamp(1.5rem,5vw,3.5rem);display:flex;flex-direction:column;gap:1.3rem}
.login-side h1{font-size:clamp(1.6rem,3.4vw,2.4rem);color:#fff}
.login-side .feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:auto}
.login-side .feat div{border:1px solid var(--hero-line);border-radius:10px;padding:12px;background:rgba(255,255,255,.04)}
.login-side .feat b{display:block;color:#fff;font-size:.9rem}
.login-side .feat span{font-size:.8rem;opacity:.8}
.login-main{display:grid;place-items:center;padding:2rem 16px}
.login-card{width:min(400px,100%)}
.hint{background:var(--flagbg);border-radius:8px;padding:.65rem .85rem;font-size:.84rem;color:var(--ink)}
@media (max-width:860px){.login{grid-template-columns:minmax(0,1fr)}.login-side .feat{display:none}}

/* dashboard */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:clamp(18px,3vw,28px);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;border:48px solid rgba(255,255,255,.035);left:-120px;top:-140px;pointer-events:none}
.hero h1{color:#fff;font-size:clamp(1.3rem,2.6vw,1.8rem)}
.hero .date{opacity:.75;font-size:.88rem}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .btn{background:rgba(255,255,255,.08);border-color:var(--hero-line);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.16)}
.hero .btn.p{background:#fff;color:#17233B;border-color:#fff}
.hero-live{border:1px solid var(--hero-line);border-radius:12px;padding:14px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.hero-live .big{font-size:2.4rem;font-weight:700;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.hero-live .it{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;border-top:1px solid var(--hero-line);padding-top:7px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:.78rem;color:var(--mut);font-weight:600}
.kpi .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .s{font-size:.76rem;color:var(--mut)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--mut)}
.legend span{display:inline-flex;gap:.35rem;align-items:center}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.feed{display:flex;flex-direction:column}
.feed .it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.feed .it:last-child{border:0}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--soft);flex:none}
.rank.r1{background:#E9C46A;color:#4A3500}.rank.r2{background:#CBD5E1;color:#26303D}.rank.r3{background:#E0A777;color:#4A2608}

/* bank */
.entry{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.entry{grid-template-columns:repeat(2,minmax(0,1fr))}}
.entry button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.entry button:hover{border-color:var(--acc);transform:translateY(-1px)}
.entry .ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--soft)}
.entry .ic svg{width:20px;height:20px}
.entry b{font-size:.95rem}
.entry span{font-size:.8rem;color:var(--mut)}
.qcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:900px){.qcards{grid-template-columns:minmax(0,1fr)}}
.qc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qc .qt{font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}
.qc img.qi{max-height:140px;max-width:100%;border-radius:6px;border:1px solid var(--line);background:#fff;align-self:flex-start}
.qc .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.qc .o{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;padding:6px 8px;border-radius:7px;border:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.qc .o.ok{border-color:var(--ok);background:var(--okbg)}
.qc .o img{max-height:60px;max-width:100%;border-radius:4px;background:#fff}
.qc .o .k{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;flex:none;font-size:.75rem}
.qc .o.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.qc .foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px}

/* question editor */
.qe{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.qe{grid-template-columns:minmax(0,1fr)}}
.eq-bar{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;display:flex;flex-direction:column;gap:6px}
.eq-tabs{display:flex;gap:4px;flex-wrap:wrap}
.eq-tabs button{border:0;background:transparent;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;color:var(--mut);font-weight:600}
.eq-tabs button.on{background:var(--acc);color:var(--onacc)}
.eq-keys{display:flex;flex-wrap:wrap;gap:4px}
.eq-keys button{border:1px solid var(--line);background:var(--card);border-radius:6px;min-width:34px;padding:.2rem .45rem;cursor:pointer;font-size:.86rem;direction:ltr}
.eq-keys button:hover{border-color:var(--acc)}
.imgslot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imgslot img{max-height:64px;border-radius:6px;border:1px solid var(--line);background:#fff}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.ched{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.ched.ok{border-color:var(--ok);background:var(--okbg)}
.k-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--mut);background:var(--card);display:grid;place-items:center;font-weight:700;cursor:pointer;flex:none}
.ched.ok .k-btn{background:var(--ok);border-color:var(--ok);color:#fff}
.sticky-prev{position:sticky;top:0;align-self:start;display:flex;flex-direction:column;gap:8px}

/* exam paper (shared) */
.qcard{display:flex;flex-direction:column;gap:12px}
.qcard .qt{font-size:1.12rem;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.qcard .qimg{max-width:100%;max-height:340px;border-radius:8px;border:1px solid var(--line);background:#fff;align-self:flex-start}
.opt{display:flex;gap:10px;width:100%;text-align:right;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;align-items:center;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--mut)}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;flex:none;font-size:.85rem;font-weight:700}
.opt .ob{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.opt .ob img{max-height:150px;max-width:100%;border-radius:6px;background:#fff;align-self:flex-start}
.opt .ot{white-space:pre-wrap;overflow-wrap:anywhere}
.opt.sel{border-color:var(--ok);background:var(--okbg)}
.opt.sel .k{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opts-col{display:flex;flex-direction:column;gap:8px}
.expl{background:var(--flagbg);border-radius:10px;padding:10px 14px;font-size:.92rem;white-space:pre-wrap}

/* exam room (LMS) */
.room{flex:1;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.room-wrap{max-width:1100px;width:100%;margin:0 auto;padding:16px clamp(10px,3vw,20px) 30px;display:flex;flex-direction:column;gap:14px}
.secs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sec{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.sec.cur{border:2px solid var(--acc)}
.sec.done{opacity:.55}
.sec b{display:block;font-size:.86rem}
.sec .t{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:700;direction:ltr;text-align:right}
.sec.low .t{color:var(--bad);animation:pulse 1s infinite}
.exam{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 260px}
@media (max-width:760px){.exam{grid-template-columns:minmax(0,1fr)}}
.qnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}

/* printable paper (preview + exported file) */
